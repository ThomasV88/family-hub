# Shared by the dev config and the server configs. The including server block must define $fh_https, $fh_proto, $fh_port and $fh_robots (see security-headers.conf).
root /var/www/html/public;
index index.php;
server_tokens off;

location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/javascript;
    try_files $uri =404;
}

location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/manifest+json;
    # vite-plugin-pwa 2.0 emits the manifest into public/build (see 01-09 summary)
    try_files /manifest.webmanifest /build/manifest.webmanifest =404;
}

location /build/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

location /icons/ {
    add_header Cache-Control "public, max-age=604800";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

# Deny dotfiles except /.well-known
location ~ /\.(?!well-known) {
    deny all;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /index.php {
    include fastcgi_params;
    fastcgi_pass app:9000;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS $fh_https;
    # Overwrite every forwarded header so client-supplied values never reach PHP (throttle keys, url generation).
    fastcgi_param HTTP_X_FORWARDED_PROTO $fh_proto;
    fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    fastcgi_param HTTP_X_FORWARDED_HOST $host;
    fastcgi_param HTTP_X_FORWARDED_PORT $fh_port;
    fastcgi_param HTTP_X_FORWARDED_PREFIX "";
    fastcgi_hide_header X-Powered-By;
}

# Only index.php is ever executed
location ~ \.php$ {
    return 404;
}
