# Shared by the dev config and the server configs. The including server block must define $fh_https, $fh_proto, $fh_port and $fh_robots (see security-headers.conf).
root /var/www/html/public;
index index.php;
server_tokens off;

location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/javascript;
    try_files $uri =404;
}

location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/manifest+json;
    # vite-plugin-pwa 2.0 emits the manifest into public/build (see 01-09 summary)
    try_files /manifest.webmanifest /build/manifest.webmanifest =404;
}

location /build/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

location /icons/ {
    add_header Cache-Control "public, max-age=604800";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

# Deny dotfiles except /.well-known
location ~ /\.(?!well-known) {
    deny all;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /index.php {
    include /etc/nginx/snippets/fastcgi-app.conf;
}

# Wish image upload: the only route with a larger body limit (everything else keeps the 1m default).
# App cap is 5 MiB; 8m leaves multipart headroom. Handed to index.php with a pinned SCRIPT_NAME.
location ~ ^/wishlist/wishes/[0-9]+/image$ {
    client_max_body_size 8m;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/fastcgi-app.conf;
}

# Finance CSV import (page and preview endpoint): the app cap is 2 MiB; 3m leaves multipart headroom. The file is
# parsed in memory and never kept. Handed to index.php with a pinned SCRIPT_NAME like the image upload.
location ~ ^/finance/import(/preview)?$ {
    client_max_body_size 3m;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/fastcgi-app.conf;
}

# Only index.php is ever executed
location ~ \.php$ {
    return 404;
}
