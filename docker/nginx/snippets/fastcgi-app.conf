# Shared php-fpm parameters for every location that hands a request to public/index.php
# (location = /index.php and the image upload location). SCRIPT_FILENAME and SCRIPT_NAME are pinned
# after fastcgi_params so they win: the upload URI is not /index.php, and an unpinned SCRIPT_NAME would
# make Symfony derive a wrong base URL and miss the route.
include fastcgi_params;
fastcgi_pass app:9000;
fastcgi_param SCRIPT_FILENAME $document_root/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param HTTPS $fh_https;
# Overwrite every forwarded header so client-supplied values never reach PHP (throttle keys, url generation).
fastcgi_param HTTP_X_FORWARDED_PROTO $fh_proto;
fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
fastcgi_param HTTP_X_FORWARDED_HOST $host;
fastcgi_param HTTP_X_FORWARDED_PORT $fh_port;
fastcgi_param HTTP_X_FORWARDED_PREFIX "";
fastcgi_hide_header X-Powered-By;
