; Memory budget (compose.server.yaml mem_limit 192m): image decodes are serialized per container by
; ImageProcessor (one at a time, ~70 MB for a 13 MP wishlist photo, up to ~112 MB total heap and ~141 MB RSS for a 12 MP medical
; photo at 3600 px: see docs/ops/server.md), so 4 children stay inside the limit unless all of them are busy during such a decode.
[www]
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
ping.path = /fpm-ping
