<!doctype html>
<html lang="sk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch 004: Todolist</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-sans); background: #d9d9d6; color: var(--color-text); padding-top: 52px; }
:root[data-theme="dark"] body { background: #0e0e0d; }
#variant-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 9998; background: #fff; border-bottom: 1px solid #ddd; padding: 8px 16px; display: flex; gap: 8px; font-family: system-ui; flex-wrap: wrap; }
.variant-tab { border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; transition: all .15s ease; color: #222; }
.variant-tab:hover { background: #f0f0f0; }
.variant-tab.active { background: #222; color: #fff; border-color: #222; }
.stage { display: flex; justify-content: center; padding: 16px; }
.frame { container-type: inline-size; container-name: frame; width: 100%; max-width: 1280px; height: calc(100vh - 92px); min-height: 560px; background: var(--color-bg); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-lg); position: relative; transition: width .2s ease; }

/* Shell (sketch 001 winner) */
.app { display: flex; height: 100%; color: var(--color-text); position: relative; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-6); border-bottom: 1px solid var(--color-border); }
.topbar h1 { font-size: var(--text-lg); font-weight: 600; margin: 0; flex: 1; letter-spacing: -.01em; }
.body { flex: 1; display: flex; min-height: 0; position: relative; }
.content { flex: 1; overflow: auto; padding: var(--space-6); padding-bottom: 100px; min-width: 0; container-type: inline-size; container-name: content; }
.icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon.s { width: 14px; height: 14px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); padding: 7px 12px; border-radius: var(--radius-md); font: inherit; font-size: var(--text-sm); cursor: pointer; transition: all .15s ease; min-height: 36px; }
.btn:hover { background: var(--color-surface-2); }
.btn.primary { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); }
.btn.primary:hover { background: var(--color-primary-hover); }
.btn.danger { color: var(--color-danger); border-color: var(--color-danger); background: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--color-text-muted); }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--color-primary-soft); color: var(--color-primary); display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.side { display: none; flex-direction: column; gap: 2px; padding: var(--space-4) var(--space-3); border-right: 1px solid var(--color-border); width: 64px; align-items: center; overflow: hidden; transition: width .2s ease; }
.side .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; padding: 4px 12px 16px; }
.side .brand .logo { width: 22px; height: 22px; border-radius: 6px; background: var(--color-primary); flex: none; }
.side .spacer { flex: 1; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--radius-md); color: var(--color-text-muted); cursor: pointer; border: 0; background: none; font: inherit; font-size: var(--text-sm); width: 44px; justify-content: center; transition: all .15s ease; }
.nav-item:hover { background: var(--color-surface-2); color: var(--color-text); }
.nav-item.active { background: var(--color-primary-soft); color: var(--color-primary); font-weight: 600; }
.label, .brand span { display: none; }
.app.open .side { width: 232px; align-items: stretch; }
.app.open .label, .app.open .brand span { display: inline; }
.app.open .nav-item { width: 100%; justify-content: flex-start; padding: 8px 12px; }
.bottom { display: flex; position: absolute; left: 0; right: 0; bottom: 0; background: var(--color-surface); border-top: 1px solid var(--color-border); padding: 6px 4px 14px; justify-content: space-around; z-index: 10; }
.bottom .nav-item { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 11px; width: auto; flex: 1; }
.bottom .label { display: inline; }
.fab { position: absolute; right: 16px; bottom: 76px; z-index: 11; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--color-primary); color: var(--color-on-primary); box-shadow: var(--shadow-md); cursor: pointer; display: grid; place-items: center; }
.collapse-btn, .add-top { display: none; }
@container frame (min-width: 640px) {
  .side { display: flex; }
  .bottom, .fab { display: none; }
  .content { padding-bottom: var(--space-6); }
  .collapse-btn, .add-top { display: inline-flex; }
}

/* To-do */
.muted { color: var(--color-text-muted); font-size: var(--text-sm); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: var(--space-4); }
.chip { border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-muted); padding: 5px 12px; border-radius: 99px; font-size: var(--text-sm); cursor: pointer; transition: all .15s ease; }
.chip:hover { background: var(--color-surface-2); }
.chip.on { background: var(--color-primary-soft); color: var(--color-primary); border-color: var(--color-primary); font-weight: 600; }
.quick { display: flex; gap: 8px; margin-bottom: var(--space-4); }
.quick input { flex: 1; padding: 9px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text); font: inherit; font-size: var(--text-sm); min-height: 40px; }
.quick input:focus { outline: 2px solid var(--color-primary-soft); border-color: var(--color-primary); }
.group { margin-bottom: var(--space-6); }
.group h3 { margin: 0 0 6px; font-size: var(--text-sm); color: var(--color-text-muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.group h3 .n { font-weight: 400; font-size: var(--text-xs); }
.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
.t { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--color-border); font-size: var(--text-sm); cursor: pointer; transition: background .15s ease; }
.t:first-child { border-top: 0; }
.t:hover { background: var(--color-surface-2); }
.t.sel { background: var(--color-primary-soft); }
.t input { accent-color: var(--color-primary); width: 18px; height: 18px; flex: none; }
.t .grow { flex: 1; min-width: 0; }
.t .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t.done .title { text-decoration: line-through; color: var(--color-text-muted); }
.t .sub { color: var(--color-text-muted); font-size: var(--text-xs); display: flex; gap: 8px; align-items: center; margin-top: 2px; }
.tag { font-size: 11px; padding: 2px 9px; border-radius: 99px; background: var(--color-surface-2); color: var(--color-text-muted); white-space: nowrap; }
.tag.warn { background: #f8e9e6; color: var(--color-danger); }
:root[data-theme="dark"] .tag.warn { background: #3a2622; }
.tag.ok { background: var(--color-primary-soft); color: var(--color-primary); }
.empty { text-align: center; padding: 28px 8px; color: var(--color-text-muted); font-size: var(--text-sm); }

/* B: by person */
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-4); }
@container content (min-width: 700px) { .cols { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@container content (min-width: 440px) and (max-width: 699px) { .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.col h3 { margin: 0 0 8px; font-size: var(--text-sm); display: flex; gap: 8px; align-items: center; }
.col .card { padding: 6px; display: grid; gap: 6px; background: var(--color-surface-2); border-color: transparent; }
.col .t { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); }
.col .t:first-child { border-top: 1px solid var(--color-border); }

/* C: table */
table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
th { text-align: left; font-weight: 600; color: var(--color-text-muted); font-size: var(--text-xs); padding: 8px 10px; border-bottom: 1px solid var(--color-border); }
td { padding: 9px 10px; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
tr.row { cursor: pointer; }
tr.row:hover { background: var(--color-surface-2); }
tr.row.sel { background: var(--color-primary-soft); }
tr.row.done td.tt { text-decoration: line-through; color: var(--color-text-muted); }
@container frame (max-width: 700px) { th.hide-s, td.hide-s { display: none; } }

/* Detail panel (side on wide frames, bottom sheet on phone) */
.detail { position: absolute; z-index: 30; background: var(--color-surface); border-left: 1px solid var(--color-border); top: 0; bottom: 0; right: 0; width: 340px; padding: var(--space-4); overflow: auto; transform: translateX(100%); transition: transform .2s ease; box-shadow: var(--shadow-lg); }
.detail.open { transform: none; }
@container frame (min-width: 900px) {
  .detail { position: static; flex: none; width: 340px; transform: none; box-shadow: none; display: none; }
  .detail.open { display: block; }
}
@container frame (max-width: 639px) {
  .detail { top: auto; left: 0; width: auto; max-height: 82%; border-left: 0; border-top: 1px solid var(--color-border); border-radius: 16px 16px 0 0; transform: translateY(100%); }
  .detail.open { transform: none; }
}
.detail h2 { margin: 0 0 var(--space-3); font-size: var(--text-lg); display: flex; align-items: center; gap: 8px; }
.detail h2 button { margin-left: auto; }
label.f { display: grid; gap: 5px; font-size: var(--text-sm); margin-bottom: var(--space-3); }
label.f > span { font-weight: 600; font-size: var(--text-xs); color: var(--color-text-muted); }
.in { width: 100%; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text); font: inherit; font-size: var(--text-sm); min-height: 38px; }
.in:focus { outline: 2px solid var(--color-primary-soft); border-color: var(--color-primary); }
.seg { display: flex; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--color-surface); color: var(--color-text-muted); padding: 8px; font: inherit; font-size: var(--text-sm); cursor: pointer; }
.seg button.on { background: var(--color-primary-soft); color: var(--color-primary); font-weight: 600; }
.hint { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 6px; margin-bottom: var(--space-3); }

#sketch-tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font-family: system-ui; font-size: 12px; background: rgba(0,0,0,.75); color: #fff; padding: 8px 12px; border-radius: 8px; opacity: .45; transition: opacity .2s; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: 92vw; }
#sketch-tools:hover { opacity: 1; }
#sketch-tools button { background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; padding: 3px 8px; font-size: 12px; cursor: pointer; }
#sketch-tools button.on { background: #fff; color: #000; }
</style>
</head>
<body>
<div id="variant-nav">
  <button class="variant-tab active" onclick="setView('a', this)">A: Skupiny podľa termínu (ako Apple Reminders)</button>
  <button class="variant-tab" onclick="setView('b', this)">B: Stĺpce podľa osôb ★ Selected</button>
  <button class="variant-tab" onclick="setView('c', this)">C: Tabuľka (ako Notion)</button>
</div>
<div class="stage">
  <div class="frame" id="frame">
    <div class="app rail" id="app">
      <aside class="side" id="side"></aside>
      <div class="main">
        <div class="topbar">
          <button class="btn collapse-btn" onclick="document.getElementById('app').classList.toggle('open')" aria-label="Prepnúť panel"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14"/></svg></button>
          <h1>Úlohy</h1><button class="btn primary add-top" onclick="document.getElementById('qi').focus()">+ Pridať</button><button class="avatar">JK</button>
        </div>
        <div class="body"><div class="content" id="content"></div><aside class="detail" id="detail"></aside></div>
      </div>
      <nav class="bottom" id="bottom"></nav>
      <button class="fab" title="Pridať" onclick="document.getElementById('qi').focus()"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>
</div>
<div id="sketch-tools">
  <span>Rámec:</span>
  <button onclick="setW('390px', this)">Mobil 390</button>
  <button onclick="setW('820px', this)">iPad 820</button>
  <button class="on" onclick="setW('100%', this)">Desktop</button>
  <button id="empty-btn" onclick="toggleEmpty(this)">Prázdny stav</button>
  <button onclick="toggleDark(this)">Tmavý režim</button>
</div>

<script>
const ICONS = {
  home: '<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  tasks: '<path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>',
  gift: '<path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7a3 3 0 1 0-3-3c0 2 3 3 3 3zm0 0a3 3 0 1 1 3-3c0 2-3 3-3 3z"/>',
  money: '<path d="M3 7h18v12H3zM3 11h18M7 15h3"/>',
  health: '<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
  repeat: '<path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>'
};
const ico = (n, c='') => `<svg class="icon ${c}" viewBox="0 0 24 24">${ICONS[n]}</svg>`;
const NAV = [['home','Prehľad'],['tasks','Úlohy'],['gift','Wishlist'],['money','Financie'],['health','Zdravie']];
const PEOPLE = ['Jana','Peter','Ema'];
const DUE = { dnes:'Dnes', zajtra:'Zajtra', tyzden:'Tento týždeň', neskor:'Neskôr', none:'Bez termínu' };
const REPEAT = { none:'Neopakuje sa', denne:'Denne', tyzden:'Týždenne', mesiac:'Mesačne', po:'Po dokončení, o 7 dní' };
let nextId = 10;
let tasks = [
  { id:1, t:'Zaplatiť školku', who:'Jana', due:'dnes', late:true, repeat:'mesiac', scope:'shared', done:false, notes:'Variabilný symbol je v e-maile.' },
  { id:2, t:'Objednať Tomáša k zubárovi', who:'Peter', due:'dnes', repeat:'none', scope:'shared', done:false, notes:'' },
  { id:3, t:'Vymeniť žiarovku v chodbe', who:'Peter', due:'zajtra', repeat:'none', scope:'shared', done:false, notes:'' },
  { id:4, t:'Vynášať smeti', who:'Ema', due:'zajtra', repeat:'tyzden', scope:'shared', done:false, notes:'' },
  { id:5, t:'Kúpiť darček pre babku', who:'Jana', due:'tyzden', repeat:'none', scope:'personal', done:false, notes:'Parfum z wishlistu.' },
  { id:6, t:'Prihlásiť Emu na krúžok', who:'Jana', due:'neskor', repeat:'none', scope:'shared', done:false, notes:'' },
  { id:7, t:'Nákup na víkend', who:'Jana', due:'dnes', repeat:'tyzden', scope:'shared', done:true, notes:'' },
  { id:8, t:'Upratať izbu', who:'Ema', due:'none', repeat:'tyzden', scope:'shared', done:false, notes:'' }
];
let view = 'a', filter = 'all', sel = null, empty = false;
const me = 'Jana';
const visible = () => (empty ? [] : tasks).filter(x => filter === 'all' ? true : filter === 'mine' ? x.who === me : filter === 'personal' ? x.scope === 'personal' : x.scope === 'shared');

function row(x) {
  const sub = [x.repeat !== 'none' ? `<span>${ico('repeat','s')} ${REPEAT[x.repeat].split(',')[0].toLowerCase()}</span>` : '', x.scope === 'personal' ? `<span>${ico('lock','s')} osobná</span>` : ''].join('');
  return `<div class="t ${x.done?'done':''} ${sel===x.id?'sel':''}" data-open="${x.id}"><input type="checkbox" data-done="${x.id}" ${x.done?'checked':''}><div class="grow"><div class="title">${x.t}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>${x.late&&!x.done?'<span class="tag warn">po termíne</span>':''}${x.due!=='none'&&view!=='a'?`<span class="tag">${DUE[x.due]}</span>`:''}${view!=='b'?`<span class="avatar" title="${x.who}">${x.who[0]}</span>`:''}</div>`;
}
function viewA() {
  const list = visible();
  if (!list.length) return `<div class="empty">Žiadne úlohy. Pridajte prvú hore.</div>`;
  const open = list.filter(x => !x.done), done = list.filter(x => x.done);
  const g = k => open.filter(x => x.due === k);
  const block = (title, arr) => arr.length ? `<div class="group"><h3>${title} <span class="n">${arr.length}</span></h3><div class="card">${arr.map(row).join('')}</div></div>` : '';
  return Object.keys(DUE).map(k => block(DUE[k], g(k))).join('') + block('Hotové', done);
}
function viewB() {
  const list = visible();
  if (!list.length) return `<div class="empty">Žiadne úlohy. Pridajte prvú hore.</div>`;
  return `<div class="cols">${PEOPLE.map(p => { const arr = list.filter(x => x.who === p); return `<div class="col"><h3><span class="avatar">${p[0]}</span>${p} <span class="muted">${arr.filter(x=>!x.done).length}</span></h3><div class="card">${arr.length?arr.map(row).join(''):'<div class="empty">Nič</div>'}</div></div>`; }).join('')}</div>`;
}
function viewC() {
  const list = visible();
  if (!list.length) return `<div class="empty">Žiadne úlohy. Pridajte prvú hore.</div>`;
  return `<div class="card" style="padding:4px 8px"><table><thead><tr><th></th><th>Úloha</th><th>Kto</th><th class="hide-s">Termín</th><th class="hide-s">Opakovanie</th></tr></thead><tbody>${list.map(x => `<tr class="row ${x.done?'done':''} ${sel===x.id?'sel':''}" data-open="${x.id}"><td style="width:34px"><input type="checkbox" data-done="${x.id}" ${x.done?'checked':''} style="accent-color:var(--color-primary);width:18px;height:18px"></td><td class="tt">${x.t}${x.late&&!x.done?' <span class="tag warn">po termíne</span>':''}${x.scope==='personal'?' '+ico('lock','s'):''}</td><td><span class="avatar" title="${x.who}">${x.who[0]}</span></td><td class="hide-s">${DUE[x.due]}</td><td class="hide-s muted">${x.repeat==='none'?'—':REPEAT[x.repeat].split(',')[0]}</td></tr>`).join('')}</tbody></table></div>`;
}
function render() {
  const f = [['all','Všetky'],['mine','Moje'],['shared','Spoločné'],['personal','Osobné']];
  document.getElementById('content').innerHTML = `<div class="quick"><input id="qi" placeholder="Pridať úlohu a stlačiť Enter…" onkeydown="if(event.key==='Enter')addTask(this)"><button class="btn primary" onclick="addTask(document.getElementById('qi'))">Pridať</button></div>
    <div class="chips">${f.map(([k,l]) => `<button class="chip ${filter===k?'on':''}" data-filter="${k}">${l}</button>`).join('')}</div>` + (view==='a'?viewA():view==='b'?viewB():viewC());
  const nav = NAV.map(([id,l]) => `<button class="nav-item ${id==='tasks'?'active':''}" title="${l}">${ico(id)}<span class="label">${l}</span></button>`).join('');
  document.getElementById('side').innerHTML = `<div class="brand"><div class="logo"></div><span>Family Hub</span></div>${nav}<div class="spacer"></div><button class="nav-item" title="Nastavenia">${ico('settings')}<span class="label">Nastavenia</span></button>`;
  document.getElementById('bottom').innerHTML = nav;
  renderDetail();
}
function renderDetail() {
  const d = document.getElementById('detail'), x = tasks.find(t => t.id === sel);
  d.classList.toggle('open', !!x);
  if (!x) { d.innerHTML = ''; return; }
  const opt = (obj, cur) => Object.entries(obj).map(([k,v]) => `<option value="${k}" ${k===cur?'selected':''}>${v}</option>`).join('');
  d.innerHTML = `<h2>Úloha <button class="btn ghost" onclick="closeDetail()" aria-label="Zavrieť">${ico('close')}</button></h2>
    <label class="f"><span>Názov</span><input class="in" value="${x.t.replace(/"/g,'&quot;')}" oninput="upd('t', this.value, true)"></label>
    <label class="f"><span>Priradené</span><select class="in" onchange="upd('who', this.value)">${PEOPLE.map(p=>`<option ${p===x.who?'selected':''}>${p}</option>`).join('')}</select></label>
    <label class="f"><span>Termín</span><select class="in" onchange="upd('due', this.value); upd('late', false)">${opt(DUE, x.due)}</select></label>
    <label class="f"><span>Opakovanie</span><select class="in" onchange="upd('repeat', this.value)">${opt(REPEAT, x.repeat)}</select></label>
    <div class="f"><span style="font-weight:600;font-size:var(--text-xs);color:var(--color-text-muted)">Viditeľnosť</span><div class="seg"><button class="${x.scope==='shared'?'on':''}" onclick="upd('scope','shared')">Spoločná</button><button class="${x.scope==='personal'?'on':''}" onclick="upd('scope','personal')">Osobná</button></div></div>
    <div class="hint">${x.scope==='personal'?'Vidíte ju len vy, ostatní členovia ju nevidia.':'Vidia ju všetci členovia s prístupom k úlohám.'}</div>
    <label class="f"><span>Poznámka</span><textarea class="in" rows="3" oninput="upd('notes', this.value, true)">${x.notes}</textarea></label>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn danger" onclick="delTask()">Zmazať</button><button class="btn primary" style="margin-left:auto" onclick="closeDetail()">Hotovo</button></div>`;
}
function upd(k, v, quiet) { const x = tasks.find(t => t.id === sel); x[k] = v; if (quiet) { renderListOnly(); } else render(); }
function renderListOnly() { const y = document.getElementById('content').scrollTop; const a = document.activeElement; const id = a && a.tagName; const c = document.getElementById('content'); const qi = document.getElementById('qi').value; render(); document.getElementById('qi').value = qi; c.scrollTop = y; }
function closeDetail() { sel = null; render(); }
function delTask() { tasks = tasks.filter(t => t.id !== sel); sel = null; render(); }
function addTask(inp) { const v = inp.value.trim(); if (!v) return; empty = false; document.getElementById('empty-btn').classList.remove('on'); tasks.unshift({ id: nextId++, t: v, who: me, due: 'dnes', repeat: 'none', scope: filter === 'personal' ? 'personal' : 'shared', done: false, notes: '' }); render(); document.getElementById('qi').focus(); }
document.addEventListener('click', e => {
  const f = e.target.closest('[data-filter]'); if (f) { filter = f.dataset.filter; render(); return; }
  const dn = e.target.closest('[data-done]'); if (dn) { return; }
  const o = e.target.closest('[data-open]'); if (o && !e.target.closest('input')) { sel = +o.dataset.open; render(); }
});
document.addEventListener('change', e => { if (e.target.dataset.done) { const x = tasks.find(t => t.id === +e.target.dataset.done); x.done = e.target.checked; render(); } });
function setView(v, btn) { view = v; document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active')); btn.classList.add('active'); render(); }
function toggleEmpty(btn) { empty = !empty; btn.classList.toggle('on', empty); sel = null; render(); }
function applySide() { const w = document.getElementById('frame').getBoundingClientRect().width; document.getElementById('app').classList.toggle('open', w >= 1024); }
new ResizeObserver(applySide).observe(document.getElementById('frame'));
function setW(w, btn) { document.getElementById('frame').style.width = w; document.querySelectorAll('#sketch-tools button').forEach(b => { if (/Mobil|iPad|Desktop/.test(b.textContent)) b.classList.remove('on'); }); btn.classList.add('on'); }
function toggleDark(btn) { const r = document.documentElement; const d = r.dataset.theme === 'dark'; r.dataset.theme = d ? 'light' : 'dark'; btn.classList.toggle('on', !d); }
render();
</script>
</body>
